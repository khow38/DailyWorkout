<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#131510" />
    <meta
      name="description"
      content="Your body. Your progress. A free, offline calisthenics routine generator and workout tracker."
    />
    <title>FORM — Own your progress</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11130f;
        --card: #1b1e17;
        --line: #33382b;
        --muted: #a5ad99;
        --ink: #f5f7ed;
        --lime: #d2fb65;
        --red: #ffb1a7;
        --radius: 20px;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.5;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button {
        color: inherit;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--lime);
        outline-offset: 4px;
      }
      a {
        color: var(--lime);
      }
      button {
        border: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(34px, 5vw, 56px);
        line-height: 1.08;
        letter-spacing: -2px;
      }
      h2 {
        font-size: 23px;
        letter-spacing: -0.7px;
      }
      h3 {
        font-size: 17px;
      }
      small,
      .small {
        font-size: 12px;
      }
      svg {
        display: inline-block;
        vertical-align: middle;
      }
      header {
        height: 88px;
        max-width: 1240px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        background: none;
        font-size: 28px;
        font-weight: 950;
        letter-spacing: -1.7px;
        padding: 0;
      }
      .brand-mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        background: var(--lime);
        color: var(--bg);
        border-radius: 8px;
        transform: rotate(-8deg);
      }
      .header-right,
      .flex {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 30px;
        padding: 6px 11px;
        font-size: 11px;
        letter-spacing: 0.5px;
        font-weight: 700;
      }
      .dot {
        width: 6px;
        height: 6px;
        background: var(--lime);
        border-radius: 50%;
      }
      .icon-btn {
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 50%;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
      }
      .muted {
        color: var(--muted);
      }
      .accent {
        color: var(--lime);
      }
      .eyebrow {
        text-transform: uppercase;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 2px;
      }
      .page {
        max-width: 1176px;
        margin: 0 auto;
        padding: 35px 0 126px;
      }
      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 27px;
      }
      .page-head p {
        margin-top: 9px;
      }
      .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        min-height: 46px;
        border-radius: 9px;
        padding: 12px 18px;
        font-size: 13px;
        font-weight: 750;
        transition:
          transform 0.18s,
          background 0.18s;
        background: var(--lime);
        color: #1b240c;
      }
      .btn:hover:not(:disabled) {
        background: #e0ff94;
        transform: translateY(-2px);
      }
      .btn.secondary {
        background: transparent;
        border: 1px solid #4b5340;
        color: var(--ink);
      }
      .btn.secondary:hover {
        background: #2b3024;
      }
      .btn.danger {
        background: #432a24;
        color: var(--red);
      }
      .btn.wide {
        width: 100%;
      }
      .text-btn {
        background: none;
        color: var(--muted);
        padding: 8px;
        font-size: 12px;
      }
      .text-btn:hover {
        color: var(--ink);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 24px;
      }
      .grid {
        display: grid;
        gap: 18px;
      }
      .two {
        grid-template-columns: minmax(0, 1.9fr) minmax(280px, 1fr);
      }
      .three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .four {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .stack > * + * {
        margin-top: 18px;
      }
      .between {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
      }
      .section-title {
        margin: 27px 0 15px;
      }
      .hero {
        min-height: 330px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        background:
          radial-gradient(ellipse at 90% 70%, #394626 0, transparent 58%),
          #20251b;
      }
      .hero-copy {
        max-width: 58%;
        position: relative;
        z-index: 1;
      }
      .hero h2 {
        font-size: clamp(42px, 5vw, 65px);
        font-weight: 900;
        line-height: 0.98;
        letter-spacing: -2.8px;
        margin: 16px 0;
      }
      .hero p {
        font-size: 13px;
        max-width: 265px;
        margin-bottom: 22px;
      }
      .hero-art {
        position: absolute;
        width: 57%;
        right: -8%;
        bottom: 7px;
        transform: rotate(-8deg);
      }
      .hero-number {
        position: absolute;
        right: 22px;
        top: 18px;
        font-size: 10px;
        letter-spacing: 2px;
        color: #afc091;
      }
      .stat {
        padding: 18px 21px;
      }
      .stat strong {
        font-size: 31px;
        font-weight: 750;
        letter-spacing: -1px;
      }
      .stat .label {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }
      .stat .stat-icon {
        color: var(--lime);
        background: #2b3520;
        border-radius: 10px;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
      }
      .week {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
        margin: 24px 0 16px;
      }
      .day {
        text-align: center;
        font-size: 10px;
        color: var(--muted);
      }
      .day span {
        display: grid;
        place-items: center;
        aspect-ratio: 1;
        border: 1px solid var(--line);
        border-radius: 50%;
        margin-top: 8px;
        font-size: 12px;
      }
      .day.planned span {
        background: #303a24;
        color: var(--lime);
      }
      .day.today span {
        outline: 1px solid var(--lime);
        outline-offset: 3px;
      }
      .day.done span {
        background: var(--lime);
        color: var(--bg);
      }
      .progress-track {
        height: 5px;
        background: #353c2c;
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-track span {
        display: block;
        height: 100%;
        background: var(--lime);
        transition: width 0.3s;
      }
      .note {
        font-size: 12px;
        line-height: 1.7;
        color: var(--muted);
        padding: 13px 16px;
        background: #24291e;
        border-radius: 10px;
      }
      .note.warn {
        border-left: 3px solid #e3c67c;
        background: #2a291e;
        color: #ded4b6;
      }
      .session-row {
        width: 100%;
        display: flex;
        align-items: center;
        text-align: left;
        gap: 15px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        margin-bottom: 9px;
      }
      .session-row:hover {
        border-color: #6c8050;
      }
      .number {
        width: 42px;
        height: 42px;
        flex-shrink: 0;
        border-radius: 10px;
        background: #2b3322;
        display: grid;
        place-items: center;
        font-size: 13px;
        color: var(--lime);
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .row-label {
        font-size: 14px;
        font-weight: 700;
      }
      .row-sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }
      .tag {
        background: #303928;
        color: #d7e9ba;
        border-radius: 5px;
        font-size: 10px;
        padding: 4px 7px;
        white-space: nowrap;
      }
      .empty {
        padding: 36px 20px;
        text-align: center;
      }
      .empty .icon-btn {
        margin: 0 auto 16px;
        width: 60px;
        height: 60px;
        color: var(--lime);
      }
      .empty p {
        max-width: 380px;
        margin: 10px auto 22px;
      }
      .chart {
        height: 118px;
        display: flex;
        gap: 10px;
        align-items: end;
        margin: 20px 0 0;
      }
      .bar {
        flex: 1;
        text-align: center;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: end;
        gap: 5px;
        font-size: 10px;
        color: var(--muted);
      }
      .bar i {
        display: block;
        min-height: 3px;
        border-radius: 4px 4px 0 0;
        background: #b8dc62;
      }
      .footer-note {
        font-size: 11px;
        color: var(--muted);
        margin-top: 25px;
        display: flex;
        justify-content: space-between;
        gap: 15px;
        flex-wrap: wrap;
      }
      nav {
        position: fixed;
        z-index: 10;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 5px;
        background: #24291fee;
        backdrop-filter: blur(16px);
        border: 1px solid #444d37;
        padding: 7px;
        border-radius: 18px;
        box-shadow: 0 10px 40px #0006;
      }
      nav button {
        background: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 44px;
        padding: 10px 22px;
        border-radius: 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      nav button.selected {
        background: var(--lime);
        color: #1b240c;
      }
      .onboarding {
        max-width: 760px;
        margin: auto;
      }
      .stepper {
        display: flex;
        gap: 7px;
        margin: 22px 0 30px;
      }
      .stepper span {
        height: 4px;
        flex: 1;
        border-radius: 2px;
        background: var(--line);
      }
      .stepper span.done {
        background: var(--lime);
      }
      .choice {
        background: #1b1e17;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 23px 19px;
        min-height: 116px;
        text-align: left;
        display: block;
        width: 100%;
      }
      .choice[aria-pressed="true"] {
        border-color: var(--lime);
        background: #29321e;
        box-shadow: inset 0 0 0 1px var(--lime);
      }
      .choice strong {
        display: block;
        margin-bottom: 7px;
      }
      .choice small {
        color: var(--muted);
        display: block;
        line-height: 1.6;
      }
      .choice .choice-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 15px;
        color: var(--lime);
      }
      .wizard-content {
        min-height: 290px;
      }
      .wizard-content h2 {
        margin-bottom: 8px;
      }
      .wizard-content > .muted {
        margin-bottom: 24px;
      }
      .wizard-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }
      .chips {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .chip {
        background: #252c20;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 13px;
        font-size: 12px;
      }
      .chip.selected {
        background: #39472a;
        color: var(--lime);
        border-color: #6a804b;
      }
      .exercise-list {
        margin-top: 16px;
      }
      .exercise-item {
        border-bottom: 1px solid var(--line);
        padding: 13px 0;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .exercise-item:last-child {
        border-bottom: 0;
      }
      .exercise-item .number {
        width: 34px;
        height: 34px;
        font-size: 11px;
      }
      .phase {
        margin: 23px 0 5px;
        font-size: 10px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: var(--lime);
        font-weight: 700;
      }
      .artboard {
        background:
          radial-gradient(ellipse at center, #303f23, transparent 70%), #171b13;
        border: 1px solid var(--line);
        border-radius: 15px;
        margin: 20px 0;
        overflow: hidden;
        position: relative;
      }
      .artboard svg {
        width: 100%;
        height: 225px;
      }
      .art-label {
        position: absolute;
        bottom: 10px;
        left: 15px;
        font-size: 9px;
        letter-spacing: 1.5px;
        color: #b5c2a3;
      }
      .artboard .pause-art {
        position: absolute;
        right: 8px;
        top: 8px;
      }
      .figure {
        stroke: var(--lime);
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .figure .head {
        fill: #d2fb65;
        stroke: none;
      }
      .figure.b {
        animation: poseB 3.2s ease-in-out infinite;
      }
      .figure.a {
        animation: poseA 3.2s ease-in-out infinite;
      }
      .guide-paused .figure {
        animation-play-state: paused !important;
      }
      .floor {
        stroke: #566747;
        stroke-width: 1.2;
      }
      .art-grid {
        stroke: #38452d;
        stroke-width: 0.5;
      }
      .held {
        animation: breathe 3s ease-in-out infinite;
        transform-origin: center;
      }
      .set-row {
        display: grid;
        grid-template-columns: 38px 1fr 1fr 74px;
        align-items: center;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .set-row.head {
        font-size: 10px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
        padding-top: 0;
      }
      .set-row input,
      .set-row select {
        width: 100%;
        min-width: 0;
        background: #11160e;
        border: 1px solid #4b553e;
        color: var(--ink);
        padding: 10px;
        border-radius: 7px;
      }
      .set-row.logged input,
      .set-row.logged select {
        opacity: 0.65;
      }
      .set-row .btn {
        min-height: 42px;
        padding: 9px;
      }
      .check-label {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 12px;
        color: var(--muted);
        margin: 18px 0;
      }
      .check-label input {
        accent-color: var(--lime);
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .timer-card {
        text-align: center;
        position: sticky;
        top: 20px;
      }
      .timer-ring {
        --pct: 100%;
        width: 194px;
        height: 194px;
        margin: 24px auto;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: conic-gradient(var(--lime) var(--pct), #323c27 0);
        padding: 5px;
      }
      .timer-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: var(--card);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .timer-value {
        font-size: 44px;
        font-variant-numeric: tabular-nums;
        letter-spacing: -2px;
      }
      .timer-card.finished .timer-ring {
        animation: alarm 1s ease-in-out 3;
      }
      .timer-actions {
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      .queue button {
        background: none;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        text-align: left;
        padding: 12px 0;
        font-size: 12px;
      }
      .queue button.current {
        color: var(--lime);
      }
      .queue .queue-dot {
        width: 20px;
        flex-shrink: 0;
        color: var(--muted);
      }
      .queue .queue-dot.complete {
        color: var(--lime);
      }
      .history-card {
        padding: 19px 22px;
        margin-bottom: 12px;
      }
      .history-card summary {
        cursor: pointer;
        list-style: none;
      }
      .history-card summary::-webkit-details-marker {
        display: none;
      }
      .history-card details[open] summary {
        margin-bottom: 14px;
      }
      .history-detail {
        border-top: 1px solid var(--line);
        padding: 12px 0;
        font-size: 12px;
      }
      .storage-warning {
        background: #3c3020;
        padding: 12px 20px;
        text-align: center;
        font-size: 12px;
        color: #ffe4b3;
      }
      .storage-warning button {
        background: none;
        color: inherit;
        text-decoration: underline;
      }
      .toast {
        position: fixed;
        z-index: 40;
        left: 50%;
        bottom: 105px;
        transform: translateX(-50%);
        background: var(--lime);
        color: #18200e;
        border-radius: 12px;
        padding: 13px 22px;
        box-shadow: 0 5px 30px #0008;
        font-size: 13px;
        font-weight: 650;
        max-width: 90vw;
      }
      .toast:empty {
        display: none;
      }
      dialog {
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px;
        max-width: 480px;
        width: calc(100% - 32px);
      }
      dialog::backdrop {
        background: #000a;
        backdrop-filter: blur(5px);
      }
      dialog p {
        margin: 12px 0 22px;
        color: var(--muted);
        font-size: 13px;
      }
      .dialog-actions {
        display: flex;
        justify-content: end;
        gap: 10px;
        flex-wrap: wrap;
      }
      dialog .stack {
        margin: 18px 0;
      }
      .notice-link {
        color: var(--muted);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .split-title {
        font-size: 12px;
        font-weight: 650;
      }
      .workout-heading {
        margin-top: 8px;
        font-size: 30px;
      }
      .spacer {
        height: 18px;
      }
      .rule {
        padding: 13px;
        border: 1px dashed #4a583a;
        border-radius: 9px;
        font-size: 11px;
        color: #bacba4;
        margin-top: 16px;
      }
      .progress-card {
        margin-bottom: 10px;
        padding: 16px;
      }
      .progress-card .btn {
        margin-top: 14px;
      }
      .scroll-x {
        overflow-x: auto;
        padding-bottom: 5px;
      }
      .time-meta {
        font-variant-numeric: tabular-nums;
      }
      .no-wrap {
        white-space: nowrap;
      }
      @keyframes poseA {
        0%,
        18%,
        88%,
        100% {
          opacity: 1;
        }
        40%,
        65% {
          opacity: 0;
        }
      }
      @keyframes poseB {
        0%,
        18%,
        88%,
        100% {
          opacity: 0;
        }
        40%,
        65% {
          opacity: 1;
        }
      }
      @keyframes breathe {
        50% {
          opacity: 0.7;
        }
      }
      @keyframes alarm {
        50% {
          box-shadow: 0 0 30px #d2fb6555;
        }
      }
      @media (min-width: 1500px) {
        .page {
          padding-top: 45px;
        }
      }
      @media (max-width: 1240px) {
        .page {
          margin: 0 32px;
        }
      }
      @media (max-width: 850px) {
        .two {
          grid-template-columns: 1fr;
        }
        .hero {
          min-height: 310px;
        }
        .timer-card {
          position: static;
        }
        .three {
          gap: 10px;
        }
        .card {
          padding: 20px;
        }
        .page {
          margin: 0 22px;
        }
        .four {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .active-grid {
          display: flex;

        openDialog(
          allDone(a) ? "That’s work, well done." : "Save a partial session?",
          `<p>You logged <b>${t.sets} working sets</b>, ${t.reps} reps, and ${t.seconds} seconds of holds. ${allDone(a) ? "Your next planned session will move forward." : "Unfinished sets stay unlogged. Your schedule position will stay unchanged."}</p>`,
          btn("Keep training", "close", "", "secondary") +
            btn("Save session", "finish-confirm"),
        );
      }
      function exportData() {
        const blob = new Blob([recoveryRaw || JSON.stringify(S, null, 2)], {
            type: "application/json",
          }),
          url = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = url;
        a.download = `form-${recoveryRaw ? "recovery-" : ""}${dayKey()}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast("Backup exported. Keep it somewhere safe.");
      }
      function settings() {
        openDialog(
          "Your space. Your data.",
          `<div class="stack"><p>FORM runs offline. Settings, routines, and sessions are stored in this browser on this device. Clearing browser data can remove them.</p><div class="between"><span class="small">Timer sound</span>${btn(S.sound ? "On ♪" : "Off ♩", "sound", "", "secondary")}</div>${btn((recoveryRaw ? "Export recovery data" : "Export all workout data") + " " + icon("download", 16), "export", "", "secondary wide")}<p class="small">Keep an export as a readable backup. Sound requires a user interaction and may be blocked when your device or browser sleeps.</p></div>`,
          btn("Reset all data", "reset", "", "danger") + btn("Done", "close"),
        );
      }
      function regress() {
        const a = S.active,
          x = a.workout.items[a.index],
          e = E[x.id];
        if (a.logs[a.index].some((r) => r.done)) {
          toast(
            "Undo logged sets for this exercise before changing its variation.",
          );
          return;
        }
        const choices = available(S.profile).filter(
          (n) => n.family === e.family && n.rank < e.rank,
        );
        if (!choices.length) {
          toast(
            "This is the first variation. Use a smaller range, shorter hold, or fewer reps.",
          );
          return;
        }
        openDialog(
          "Find a controllable variation",
          `<p>This changes the current session only. Your plan stays at its current rung.</p><div class="stack">${choices.map((n) => btn(esc(n.name), "regress-confirm", `data-id="${n.id}"`, "secondary wide")).join("")}</div>`,
        );
      }
      $("#dialog").addEventListener("click", (e) => {
        if (e.target === $("#dialog")) {
          const r = e.target.getBoundingClientRect();
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            e.target.close();
        }
      });
      document.addEventListener("change", (event) => {
        if (externalChange) return;
        const t = event.target;
        if (!S.active || !t.dataset.field) return;
        if (t.dataset.field === "form")
          S.active.form[S.active.index] = t.checked;
        else if (!readSet(Number(t.dataset.set))) return;
        save();
      });
      document.addEventListener("click", (event) => {
        const b = event.target.closest("[data-action]");
        if (!b || b.disabled) return;
        const action = b.dataset.action;
        if (externalChange && !["reload", "export", "close"].includes(action)) {
          toast("Reload to use the data saved by the other tab.");
          return;
        }
        if (action === "reload") {
          location.reload();
          return;
        }
        unlockAudio();
        switch (action) {
          case "nav":
            navigate(b.dataset.view);
            break;
          case "routine":
            selectedDay = Number(b.dataset.day);
            navigate("routine");
            break;
          case "choice": {
            const k = b.dataset.key,
              v = b.dataset.value;
            if (k === "equipment") {
              if (v === "none") draft.equipment = [];
              else
                draft.equipment = draft.equipment.includes(v)
                  ? draft.equipment.filter((x) => x !== v)
                  : [...draft.equipment, v];
            } else draft[k] = ["level", "days"].includes(k) ? Number(v) : v;
            render();
            break;
          }
          case "next":
            step = Math.min(3, step + 1);
            render();
            $("#app").focus();
            break;
          case "back":
            step = Math.max(0, step - 1);
            render();
            $("#app").focus();
            break;
          case "generate":
            if (!S.active) {
              S.profile = structuredClone(draft);
              S.plan = generate(S.profile, S.upgrades);
              selectedDay = 0;
              save();
              navigate("routine");
              toast(
                "Your plan is ready. Start with controlled, comfortable reps.",
              );
            }
            break;
          case "start":
            start(Number(b.dataset.day));
            break;
          case "exercise":
            if (S.active) {
              S.active.index = Math.max(
                0,
                Math.min(
                  Number(b.dataset.index),
                  S.active.workout.items.length - 1,
                ),
              );
              save();
              render();
            }
            break;
          case "log": {
            const a = S.active,
              j = Number(b.dataset.set),
              r = a.logs[a.index][j];
            if (!r.done && !readSet(j)) break;
            r.done = !r.done;
            const x = a.workout.items[a.index];
            if (r.done && x.rest) runTimer(x.rest);
            save();
            render();
            if (a.logs[a.index].every((s) => s.done))
              toast("All sets logged. Move on when you’re ready.");
            break;
          }
          case "guide":
            guidePaused = !guidePaused;
            render();
            break;
          case "worktimer":
            runTimer(S.active.workout.items[S.active.index].low, "work");
            break;
          case "timer-toggle": {
            const t = S.active.timer;
            if (t.status === "running") {
              t.remaining = remaining(t);
              t.status = "paused";
              save();
              paintTimer();
            } else if (t.status === "paused") {
              t.deadline = Date.now() + t.remaining;
              t.status = "running";
              save();
              paintTimer();
            } else
              runTimer(
                t.duration
                  ? t.duration / 1000
                  : S.active.workout.items[S.active.index].rest || 60,
                t.kind,
              );
            break;
          }
          case "timer-skip":
            S.active.timer = emptyTimer();
            save();
            paintTimer();
            toast("Timer skipped.");
            break;
          case "sound":
            S.sound = !S.sound;
            save();
            if ($("#dialog").open) settings();
            else render();
            break;
          case "finish":
            finishPrompt();
            break;
          case "finish-confirm": {
            const a = S.active;
            if (!a) break;
            const h = {
              ...structuredClone(a),
              endedAt: Date.now(),
              complete: allDone(a),
            };
            h.timer = emptyTimer();
            S.history.push(h);
            if (h.complete && S.plan?.id === a.planId)
              S.plan.cursor = (a.day + 1) % S.plan.workouts.length;
            S.active = null;
            save();
            $("#dialog").close();
            navigate("history");
            toast(
              h.complete
                ? "Session complete. Strong work."
                : "Partial session saved. Your work still counts.",
            );
            break;
          }
          case "discard":
            openDialog(
              "Discard this session?",
              "<p>This removes the active session and its unsaved workout history. Your earlier sessions remain.</p>",
              btn("Keep training", "close", "", "secondary") +
                btn("Discard session", "discard-confirm", "", "danger"),
            );
            break;
          case "discard-confirm":
            S.active = null;
            save();
            $("#dialog").close();
            navigate("home");
            break;
          case "upgrade": {
            if (S.active) break;
            const s = suggestions().find((x) => x.id === b.dataset.id);
            if (!s) break;
            openDialog(
              "Take the next step?",
              `<p>Move from <b>${esc(E[s.id].name)}</b> to <b>${esc(E[s.next].name)}</b> in future sessions. Start at the lower end of the range; use an easier variation if control breaks down.</p>`,
              btn("Keep current", "close", "", "secondary") +
                btn("Update plan", "upgrade-confirm", `data-id="${s.id}"`),
            );
            break;
          }
          case "upgrade-confirm": {
            if (S.active) break;
            const s = suggestions().find((x) => x.id === b.dataset.id);
            if (!s) break;
            S.upgrades[`${S.profile.level}:${E[s.id].family}`] = s.next;
            S.plan = generate(S.profile, S.upgrades, S.plan);
            save();
            $("#dialog").close();
            render();
            toast("Progression applied to future sessions.");
            break;
          }
          case "regress":
            regress();
            break;
          case "regress-confirm": {
            const a = S.active,
              i = a.index,
              old = a.workout.items[i];
            const n = E[b.dataset.id];
            if (a.logs[i].some((r) => r.done) || n.family !== E[old.id].family)
              break;
            const item = prescription(n, old.phase, S.profile);
            a.workout.items[i] = item;
            a.logs[i] = Array.from({ length: item.sets }, () => ({
              value: item.low,
              rpe: item.rpe,
              done: false,
            }));
            a.form[i] = false;
            a.timer = emptyTimer();
            save();
            $("#dialog").close();
            render();
            break;
          }
          case "settings":
            settings();
            break;
          case "export":
            exportData();
            break;
          case "close":
            $("#dialog").close();
            break;
          case "reset":
            openDialog(
              "Start fresh?",
              "<p>This permanently removes this app’s settings, plan, active session, and workout history from this browser. Export a backup first if you want to keep your records.</p>",
              btn("Cancel", "close", "", "secondary") +
                btn("Delete all FORM data", "reset-confirm", "", "danger"),
            );
            break;
          case "reset-confirm": {
            recoveryRaw = "";
            S = fresh();
            save();
            draft = defaultProfile();
            $("#dialog").close();
            navigate("home");
            toast("FORM data reset.");
            break;
          }
          case "about":
            openDialog(
              "Simple rules. Real work.",
              `<p>FORM is a transparent, rule-based planner. It matches a progression matrix to your level and equipment, chooses a weekly split, and adjusts repetitions and rest to your goal.</p><p>The app’s specific rep ranges and progression thresholds are design choices, informed by general resistance-training principles. They are not a clinical prescription or an AI model’s assessment.</p><p>A progression is offered after your latest logged attempt completes every prescribed set at the upper target, at or below target RPE, with controlled form confirmed. Progressions are always optional.</p><p>Learn more: <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/" target="_blank" rel="noopener noreferrer">ACSM resistance training position stand (2026)</a>. Movement drawings are simplified cues, not full technique demonstrations.</p>`,
              btn("Got it", "close"),
            );
            break;
        }
      });
      window.addEventListener("storage", (e) => {
        if (
          (e.key === KEY || e.key === null) &&
          e.storageArea === localStorage
        ) {
          externalChange = true;
          renderBanner();
        }
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && !externalChange) tick();
      });
      setInterval(() => {
        if (!externalChange) tick();
      }, 250);
      render();
      tick();
    </script>
  </body>
</html>
